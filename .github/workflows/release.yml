name: release

# A tag named vMAJOR.MINOR.PATCH builds the release archives with `make
# release`, and build-fips runs in parallel with `make release-fips` (Linux
# amd64 and arm64 with GOFIPS140=v1.0.0, publishing _fips archives beside
# SHA256SUMS.fips). A manual dispatch is the dry run: it builds everything
# and publishes nothing. Signing, an SBOM and provenance are Phase 106c's.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, such as 0.4.0-dryrun (nothing is published)"
        required: true
        default: "0.4.0-dryrun"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      # A release is cut from main only: a tag on a branch's commit is refused
      # before anything is built, as the pre-push hook refuses it.
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # The release body is the tag's own notes (docs/releases/<tag>.md), written
      # and reviewed with the change that prepares the release. Its links are
      # relative to that file, which a release page cannot follow, so they are
      # made absolute and pinned to the tag here, before anything is built; a
      # tag with no notes file stops the run now rather than after the build.
      - name: Prepare the release notes
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: make release-notes
      - name: Build every archive
        # The version reaches make as an environment variable, never inside
        # the command line, so nothing in a tag name or an input is expanded.
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
        run: make release
      - name: Verify the checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archives
          path: dist/
          if-no-files-found: error

  build-fips:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build every FIPS archive
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          RELEASE_FIPS_DIR: dist-fips
        run: make release-fips
      - name: Verify the FIPS checksums
        run: cd dist-fips && sha256sum -c SHA256SUMS.fips
      - name: Verify the FIPS binaries
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          # Every archive's binaries are held to their build stamp, which go reads
          # for any architecture; only the runner's own architecture is started.
          for arch in amd64 arm64; do
            archive=$(find dist-fips -maxdepth 1 -name "the-pleiades_*_linux_${arch}_fips.tar.gz" -print -quit)
            test -n "$archive"
            mkdir "$dir/$arch"
            tar -xzf "$archive" -C "$dir/$arch"
            for bin in pleiades controller runner; do
              # Read whole into a variable: grep -q on a pipe can end go early.
              stamp=$(go version -m "$dir/$arch/$bin")
              grep -E '^[[:space:]]*build[[:space:]]+GOFIPS140=v1\.0\.0(-[0-9a-f]+)?$' <<<"$stamp" >/dev/null
              grep -E '^[[:space:]]*build[[:space:]]+DefaultGODEBUG=(.*,)?fips140=on(,.*)?$' <<<"$stamp" >/dev/null
              grep -E "^[[:space:]]*build[[:space:]]+GOARCH=${arch}\$" <<<"$stamp" >/dev/null
            done
          done
          for bin in pleiades controller runner; do
            "$dir/amd64/$bin" version
            GODEBUG=fips140=only "$dir/amd64/$bin" version
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archives-fips
          path: dist-fips/
          if-no-files-found: error

  publish:
    # Only a pushed tag publishes; the manual dry run stops after build.
    if: github.ref_type == 'tag'
    needs: [build, build-fips]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives-fips
          path: dist-fips
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # The release body is the notes the build job prepared, with their links
        # made absolute (make release-notes); the archive globs below do not
        # match RELEASE_NOTES.md, so it is the body and not an asset.
        run: |
          notes="dist/RELEASE_NOTES.md"
          if [ ! -f "$notes" ]; then echo "no release notes at $notes" >&2; exit 1; fi
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist-fips/*.tar.gz dist-fips/SHA256SUMS.fips --repo "$REPO" --title "$(cat dist/RELEASE_TITLE)" --notes-file "$notes"
