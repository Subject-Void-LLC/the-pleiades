name: CI

# Phase 118: the tests run here again, split by what they need.
#
# Until Phase 118 this workflow ran no tests at all, because `make ci`
# never once went green on a hosted runner: it ran the suite three and a
# half times over in one job, pulled every image anonymously from Docker
# Hub, and ran on two cores. Each of those is answered below. The suite
# runs once (test-full's one tagged pass), divided across jobs by what a
# package needs; images come from a cache, with an optional Docker Hub
# login; and a public repository's runners have four cores. Every job
# calls a make target, so a developer runs exactly what a job ran: there
# is no CI-only step and no CI-only tool version.
#
#   ci          build, vet, format, scanners, generated trees, workflow lint
#               (make ci-remote), on Linux, macOS and Windows
#   fast        every package that starts no container, once through the
#               full pass and three times over (make ci-fast)
#   containers  the container packages, in four shards (make ci-containers)
#   coverage    the floors, from the numbers those jobs recorded
#               (make coverage-measured), not from a fourth run
#   nightly     the whole suite with no tolerance at all (make test-full),
#               so a flake rate is measured rather than forgiven
#   winrm       the WinRM gates against the Windows runner's own WinRM
#               service; experimental until it has passed here
#
# The fast and container jobs apply push-gate's rule: a failure that passes
# when re-run alone is contention, reported in the job summary, and a
# failure that fails alone fails. A real concurrency bug looks the same as
# contention, which is why nightly exists and why every tolerated failure
# is named on the summary page rather than hidden in a log.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # The static checks: compilation on three operating systems, vet under
    # both tag sets, gofmt, module tidiness, the pinned scanners, the
    # generated trees, the Helm lint, the internal-docs citation lint and
    # the workflow lint. That set is `make ci-remote`. The three-OS matrix
    # is also the guard against a _windows/_linux/_darwin filename suffix
    # silently constraining a file to one platform (FAILURE_PATTERNS 51):
    # compilation alone sees it. macOS is blocking and Windows advisory,
    # per PLAN.md's platform requirement.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            required: true
          - os: macos-latest
            required: true
          - os: windows-latest
            required: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # `make tools` installs the scanner and linter versions the Makefile
      # pins (GOSEC_VERSION, GOVULNCHECK_VERSION, ACTIONLINT_VERSION), the
      # same ones a developer's gate installs. It is its own step so an
      # installation failure shows as its own red step.
      - name: Install pinned tools
        if: runner.os == 'Linux'
        run: make tools

      - name: Install pinned Helm
        if: runner.os == 'Linux'
        env:
          HELM_VERSION: v4.2.4
          HELM_SHA256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
        run: |
          set -euo pipefail
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tar.gz linux-amd64
          helm version --short

      - name: ci-remote
        if: runner.os == 'Linux'
        run: make ci-remote

      - name: build + vet (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          go build ./...
          go vet ./...

  fast:
    # Every package that starts no container. macOS last ran this tier
    # before the Linux-only tests (Landlock, memfd) existed, so it is
    # allowed to fail until it has passed once, then made blocking.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            required: true
          - os: macos-latest
            required: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: make ci-fast
        run: make ci-fast
      - name: Keep the coverage for the floor check
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-fast
          path: .coverage/fast.json
          if-no-files-found: error

  containers:
    # The container packages, divided four ways. The shards partition the
    # list (tools/testgate -shard), so the four jobs test every container
    # package exactly once.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # A read-only Docker Hub token raises the pull limit. It is optional:
      # a fork's pull request has no secrets, and the image cache below is
      # what keeps pulls rare either way. The secret is only in this step's
      # environment.
      - name: Docker Hub token present?
        id: hub
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        if: steps.hub.outputs.present == 'yes'
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$TOKEN" | docker login --username "$USERNAME" --password-stdin

      # The images this shard's packages start, from their source
      # (tools/testimages), cached under a key made from that list, so a
      # changed pin is a new cache entry and an unchanged one is not
      # pulled at all.
      - name: List this shard's images
        run: make ci-images SHARD="$SHARD" IMAGES=.ci/images.txt
      - name: Restore cached images
        id: images
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/images.tar
          key: test-images-${{ hashFiles('.ci/images.txt') }}
      - name: Load cached images
        if: steps.images.outputs.cache-hit == 'true'
        run: docker load --input .ci/images.tar
      - name: Pull and cache images
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          make ci-images SHARD="$SHARD" IMAGES=.ci/images.txt PULL=-pull
          xargs docker save --output .ci/images.tar < .ci/images.txt
      - name: Save the image cache
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/images.tar
          key: test-images-${{ hashFiles('.ci/images.txt') }}

      - name: make ci-containers
        run: make ci-containers SHARD="$SHARD"
      - name: Keep the coverage for the floor check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-containers-${{ matrix.shard }}
          path: .coverage/*.json
          if-no-files-found: error

  coverage:
    # The ratchet, from the numbers the test jobs recorded. It runs only
    # when every test job passed: a failed job's numbers are not a
    # measurement, and a floored package with no number fails here.
    if: github.event_name != 'schedule'
    needs: [fast, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: .coverage
          merge-multiple: true
      - name: make coverage-measured
        run: make coverage-measured

  nightly:
    # The whole suite in one strict pass, with no tolerance, on the default
    # branch. What the pull-request jobs forgive as contention, this counts.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Pull every container package's images
        run: make ci-images SHARD=1/1 IMAGES=.ci/images.txt PULL=-pull
      - name: make test-full
        run: make test-full
      - name: make coverage-measured
        run: make coverage-measured

  winrm:
    # The WinRM gates against the Windows runner's own WinRM service, set up
    # by the same script the lab uses (examples/windows_lab), connecting
    # over loopback, which the listener's certificate covers. Experimental:
    # it claims nothing until it has passed here, and its failure blocks
    # nothing until then.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Set up the WinRM certificate listener
        shell: powershell
        run: ./examples/windows_lab/winrm-cert-setup.ps1 -AllowedSubnet 127.0.0.0/8 -OutputDirectory "$env:RUNNER_TEMP\pleiades-gate"
      - name: WinRM gates
        shell: bash
        env:
          PLEIADES_WINRM_HOST: 127.0.0.1
          PLEIADES_WINRM_PORT: "5986"
          PLEIADES_WINRM_PFX: ${{ runner.temp }}\pleiades-gate\client.pfx
          PLEIADES_WINRM_PFX_PASSWORD_FILE: ${{ runner.temp }}\pleiades-gate\client.pfx.passphrase
          PLEIADES_WINRM_CA: ${{ runner.temp }}\pleiades-gate\ca.pem
        run: go test -count=1 -v -run 'ReleaseGate|Stress|Stranger|SilentPort' ./pkg/winrmexec/ ./internal/transport/winrm/
