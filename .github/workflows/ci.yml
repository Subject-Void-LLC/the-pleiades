name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # What this job runs, and deliberately does not.
    #
    # It runs the checks that are cheap, deterministic and need no
    # infrastructure: compilation on three operating systems, vet under
    # both tag sets, gofmt, module tidiness, the two pinned security
    # scanners (gosec, govulncheck), the generated-tree checks (docs,
    # templ), the Helm chart lint and the internal-docs citation lint.
    # That set is exactly `make ci-remote`.
    #
    # It does NOT run the test suite. `make ci` still exists and is still
    # the strict, whole gate, and it is now a LOCAL gate: a developer runs
    # it directly, and `.githooks/pre-push` (installed once per clone with
    # `make hooks`) runs the flake-tolerant `make push-gate` before every
    # push. The heavy evidence -- test-race, test-repeat, test-integration
    # and the coverage ratchet -- is produced on a machine with a real
    # Docker daemon and never here.
    #
    # This is a retreat from what this workflow used to attempt, and the
    # reason is that the attempt did not work. Around twenty packages in
    # this module provision real ephemeral containers (NATS, sshd,
    # Postgres, LocalStack, Toxiproxy) through testcontainers-go; `make
    # ci` runs the suite three times over (test-race, then test-repeat at
    # -count=3, then test-integration) plus a fourth full run inside
    # tools/coverage-check; and several of those packages are
    # timing-sensitive on purpose -- internal/event's Phase 96a release
    # gate alone severs a real broker for 150 seconds, because the defect
    # it guards cannot be reproduced by a shorter outage. Anonymous
    # registry pulls, two-core runners and that workload have never
    # produced a green result here. A permanently red gate gates nothing,
    # and it teaches everyone to scroll past red, which costs more than it
    # was ever buying.
    #
    # State the price plainly rather than leave it to be discovered:
    # nothing in this workflow proves that a single test passes. A pull
    # request from someone who never ran `make hooks`, or who pushed with
    # --no-verify, has had its compilation and its static analysis checked
    # and nothing else. Putting test coverage back here means a runner
    # with Docker and a deliberately narrow package selection, not simply
    # restoring `make ci` to the step below.
    #
    # The three-OS matrix stays, because build and vet are the whole of
    # what it was ever proving. PLAN.md's platform requirement: Pleiades
    # must run on Linux and SHOULD run on macOS; running the controller on
    # Windows is a stretch goal this Part is allowed to miss. Linux is the
    # only leg that runs the checks above, since it is the only one where
    # `make`, gosec, govulncheck and helm are all available; macOS is
    # BLOCKING and Windows is ADVISORY (continue-on-error), because a red
    # required check for a stretch goal trains everyone to ignore red
    # checks generally.
    #
    # That matrix is also the guard against the platform-suffix filename
    # trap this project has already been bitten by once
    # (FAILURE_PATTERNS.md #51): Go silently reads a `_windows`, `_linux`
    # or `_darwin` filename suffix as an implicit GOOS build constraint,
    # and pkg/capability/capabilities_windows.go had therefore never
    # compiled on Linux since the phase that wrote it. A single-OS job
    # cannot see that bug; this three-OS one can, and it can see it with
    # compilation alone, which is why dropping the tests below costs
    # nothing there. Watch for exactly this shape in any file Part XV's
    # later phases add (serial_linux.go, socket_windows.go,
    # transport_darwin.go are all names an author would reach for).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            required: true
          - os: macos-latest
            required: true
          - os: windows-latest
            required: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # gopls is part of AGENTS.md's own required tooling for anyone
      # editing this repository, but is not something CI itself invokes;
      # gosec and govulncheck are the two this job actually runs, so only
      # those two are installed here, and only on the leg that runs them.
      #
      # The versions deliberately are not named here. `make tools`
      # installs the ones pinned in the Makefile (GOSEC_VERSION,
      # GOVULNCHECK_VERSION), which is also what a developer's own local
      # gate installs, so this job and a local run cannot check with
      # different scanners. These steps previously installed @latest,
      # which meant a new scanner release could turn this job red on a
      # commit that changed nothing, and that a local pass said nothing
      # reliable about what would happen here. Bumping a version is a
      # commit against the Makefile, reviewed like any other change.
      #
      # This step is redundant with `make ci-remote` (which depends on
      # `tools`) and is kept only so that a tool installation failure
      # shows up as its own red step rather than inside the checks step's
      # output.
      - name: Install pinned gosec and govulncheck
        if: runner.os == 'Linux'
        run: make tools

      # `make helm-lint` (tools/helm-lint) shells out to a real helm binary to
      # render helm/the-pleiades and to prove the configurations that chart
      # refuses really are refused. ubuntu-latest does not ship one, and the
      # tool fails rather than skipping when helm is missing, so it has to be
      # installed here. Only the Linux leg runs helm-lint, so only it needs
      # this.
      #
      # Downloaded and checksummed rather than pulled in through a third-party
      # action, and pinned to an exact version rather than a channel, for the
      # same reason GOSEC_VERSION and GOVULNCHECK_VERSION are pinned in the
      # Makefile: a renderer that changes underneath this job could turn CI red
      # on a commit that changed nothing, and a local run would stop predicting
      # what happens here. The checksum is the one published beside the archive
      # at https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz.sha256sum, so a
      # tampered or truncated download fails this step instead of quietly
      # linting with something else.
      - name: Install pinned Helm
        if: runner.os == 'Linux'
        env:
          HELM_VERSION: v4.2.4
          HELM_SHA256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
        run: |
          set -euo pipefail
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tar.gz linux-amd64
          helm version --short

      # The whole of this workflow's judgement, on the one leg that can
      # make it. See the job comment above for what ci-remote covers and
      # what it knowingly leaves to the local gate.
      - name: ci-remote
        if: runner.os == 'Linux'
        run: make ci-remote

      # macOS and Windows: compilation only, and the same two commands on
      # both, so there is nothing platform-specific to keep in step. GNU
      # Make does not ship with GitHub's windows-latest image, which is
      # why this is a bare `go build`/`go vet` pair rather than a make
      # target.
      #
      # Deliberately NOT a second `go vet -tags integration ./...` pass,
      # even though the Makefile's own vet target runs one and the
      # integration-tagged files are the largest tests in this repository.
      # Those files have never been compiled for darwin or windows by
      # anything, so adding the pass here would be adding an unverified
      # check to the one job this change exists to get green, and the
      # thing it would guard -- the platform-suffix filename trap in the
      # job comment above -- is already caught by the untagged build and
      # vet. Worth doing later, on purpose, as its own change that starts
      # by finding out whether it passes.
      - name: build + vet (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          go build ./...
          go vet ./...
