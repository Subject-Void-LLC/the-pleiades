name: CI
# A dispatch from make branch-containers carries a nonce, and its run is
# named by it, so tools/branchci follows the run its own dispatch made
# rather than another dispatch's at the same commit. Every other run keeps
# the name GitHub would give it.
run-name: ${{ inputs.nonce && format('branch-containers {0}', inputs.nonce) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

# Phase 118: the tests run here again, split by what they need.
#
# Until Phase 118 this workflow ran no tests at all, because `make ci`
# never once went green on a hosted runner: it ran the suite three and a
# half times over in one job, pulled every image anonymously from Docker
# Hub, and ran on two cores. Each of those is answered below. The suite
# runs once (test-full's one tagged pass), divided across jobs by what a
# package needs; images come from a cache, with an optional Docker Hub
# login; and a public repository's runners have four cores. Every job
# calls a make target, so a developer runs exactly what a job ran: there
# is no CI-only step and no CI-only tool version.
#
#   ci          build, vet, format, scanners, generated trees, workflow lint
#               (make ci-remote), on Linux, macOS and Windows
#   fast        every package that starts no container, once through the
#               full pass and three times over (make ci-fast), on Linux
#   fast-macos  the same on macOS, advisory until it has passed once
#   containers  the container packages, in six shards (make ci-containers),
#               tests/e2e divided among them test by test
#   branch-plan, branch-containers  a branch's changed container packages
#               alone, on a dispatch with packages (make branch-containers),
#               before its pull request: the native engine this machine
#               lacks; branch-plan checks the packages and sizes the shards
#               (make ci-branch-plan)
#   coverage    the floors, from the numbers those jobs recorded
#               (make coverage-measured), not from a fourth run
#   nightly     the whole suite with no tolerance at all (make test-full),
#               so a flake rate is measured rather than forgiven
#   vulns       govulncheck on the schedule, since a new advisory needs no
#               code change to land (make govulncheck)
#
# Every test job runs tools/testgate, which holds the runner to the one
# memory and disk policy every other machine runs under
# (tools/internal/headroom): -p lowered to what the free memory fits, the
# run refused on a disk under 4 GB, and stopped before the runner runs
# out, with each package's cost in the record.
#
# The experimental winrm job (the WinRM gates against the Windows runner's
# own service) was cut on 2026-10-29: it had never passed and blocked
# nothing, and the lab's win-check VM is the WinRM target the pre-push gate
# tests. It can come back as its own change.
#
# The fast and container jobs apply push-gate's rule: a failure that passes
# when re-run alone is contention, reported in the job summary, and a
# failure that fails alone fails. A real concurrency bug looks the same as
# contention, which is why nightly exists and why every tolerated failure
# is named on the summary page rather than hidden in a log.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Container packages to test alone (import paths, space-separated).
          Empty runs what a dispatch always ran. make branch-containers sets
          it to a branch's changed container packages before its pull request.
        type: string
        default: ""
      nonce:
        description: >-
          Names the run (branch-containers <nonce>), so make branch-containers
          follows the run its own dispatch made. Leave it empty by hand.
        type: string
        default: ""

permissions:
  contents: read

# A packages dispatch is a group of its own, so it neither waits behind a
# full or nightly dispatch on the branch nor cancels another one waiting.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ inputs.packages != '' && format('-branch-{0}', inputs.nonce) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # The static checks: compilation on three operating systems, vet under
    # both tag sets, gofmt, module tidiness, the pinned scanners, the
    # generated trees, the Helm lint, the internal-docs citation lint and
    # the workflow lint. That set is `make ci-remote`. The three-OS matrix
    # is also the guard against a _windows/_linux/_darwin filename suffix
    # silently constraining a file to one platform (FAILURE_PATTERNS 51):
    # compilation alone sees it. macOS is blocking and Windows advisory,
    # per PLAN.md's platform requirement.
    if: github.event_name != 'schedule' && inputs.packages == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            required: true
          - os: macos-latest
            required: true
          - os: windows-latest
            required: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Go at go.mod's toolchain release (.github/actions/setup-go).
      - uses: ./.github/actions/setup-go

      # `make tools` installs the scanner and linter versions the Makefile
      # pins (GOSEC_VERSION, GOVULNCHECK_VERSION, ACTIONLINT_VERSION), the
      # same ones a developer's gate installs. It is its own step so an
      # installation failure shows as its own red step.
      - name: Install pinned tools
        if: runner.os == 'Linux'
        run: make tools

      - name: Install pinned Helm
        if: runner.os == 'Linux'
        env:
          HELM_VERSION: v4.2.4
          HELM_SHA256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
        run: |
          set -euo pipefail
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tar.gz linux-amd64
          helm version --short

      - name: ci-remote
        if: runner.os == 'Linux'
        run: make ci-remote

      - name: build + vet (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          go build ./...
          go vet ./...

  fast:
    # Every package that starts no container, on Linux. The coverage job
    # needs this one, so it holds only required work: macOS is its own job
    # below, which nothing needs.
    if: github.event_name != 'schedule' && inputs.packages == ''
    # 24.04 by name, not ubuntu-latest, which becomes Ubuntu 26 on
    # 2026-10-19: the user namespace step below is 24.04's AppArmor
    # setting, and the job requires those tests, so a new release is a
    # change to make on purpose rather than one that turns this red.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-go
      # Ubuntu 24.04 refuses unprivileged user namespaces through AppArmor,
      # and three tests re-run themselves as root in one (a real mount, a
      # real account database). They skip where the host refuses, so this
      # job allows them and then requires them: a runner that loses the
      # ability fails the job instead of quietly running three fewer tests.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # The serial-over-PTY tests skip without socat, which the runner image
      # does not ship; the clean room's skip ledger is what showed six of
      # them never running. Required below, so losing it turns this red.
      - name: Install socat for the PTY-backed serial tests
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends socat
      # Linux refuses a connection to a port bound but not listened on,
      # which internal/testsupport/refusing checks before handing one out
      # and skips without; required, so a runner that stops refusing fails.
      # The few container-free tests that build an image or ask compose skip
      # without a Docker daemon (a Mac with only the CLI); the runner has one,
      # so docker is required here too.
      - name: make ci-fast
        env:
          PLEIADES_TEST_REQUIRE: userns,socat,refusing-port,docker
        run: make ci-fast
      - name: Keep the coverage for the floor check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-fast
          path: .coverage/fast.json
          if-no-files-found: error
          # upload-artifact 4.4+ skips hidden paths by default, and a
          # wildcard under .coverage/ is skipped whole: its search starts
          # at the hidden directory.
          include-hidden-files: true

  fast-macos:
    # The same tier on macOS. It last ran before the Linux-only tests
    # (Landlock, memfd) existed, so it is allowed to fail until it has
    # passed once, then made blocking. Its own job rather than a matrix leg
    # of fast, so a failure here cannot decide whether coverage runs.
    if: github.event_name != 'schedule' && inputs.packages == ''
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-go
      - name: make ci-fast
        run: make ci-fast

  containers:
    # The container packages, divided six ways. The shards partition the
    # list (tools/testgate -shard), so the six jobs test every container
    # package exactly once, and balance it by each package's measured time
    # (tools/testgate/durations.json, which the coverage job holds to what
    # these jobs measured), since a pull request waits for the slowest.
    # tests/e2e, fourteen minutes on its own, is timed and dealt test by
    # test, or no number of shards could finish sooner than it does.
    if: github.event_name != 'schedule' && inputs.packages == ''
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SHARD: ${{ matrix.shard }}/6
    steps:
      # A standard runner is promised 14 GB of disk. A shard pulls up to
      # 4.8 GB of images and then writes them again as its cache tar,
      # beside Go's module and -race build caches, so the toolchains these
      # jobs never use are removed first. Deleting them took one to three
      # and a half minutes, so it runs in the background while the job
      # checks out and sets up Go, and the image restore waits for it.
      - name: Free disk space, in the background
        run: |
          ( sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
            touch "$RUNNER_TEMP/disk-freed" ) > /dev/null 2>&1 &
      # Full history: the upgrade gates build the previous release from where
      # this branch left main, which a one-commit checkout does not hold.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go

      # A read-only Docker Hub token raises the pull limit. It is optional:
      # a fork's pull request has no secrets, and the image cache below is
      # what keeps pulls rare either way. The secret is only in this step's
      # environment.
      - name: Docker Hub token present?
        id: hub
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        if: steps.hub.outputs.present == 'yes'
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$TOKEN" | docker login --username "$USERNAME" --password-stdin

      # The images this shard's packages start, from their source
      # (tools/testimages), cached under a key made from that list, so a
      # changed pin is a new cache entry and an unchanged one is not
      # pulled at all.
      - name: List this shard's images
        run: make ci-images SHARD="$SHARD" IMAGES=.ci/images.txt
      - name: Wait for the disk to be freed
        run: |
          for _ in $(seq 600); do
            if [ -f "$RUNNER_TEMP/disk-freed" ]; then df -h / | tail -1; exit 0; fi
            sleep 1
          done
          echo "freeing the disk did not finish within ten minutes" >&2
          exit 1
      - name: Restore cached images
        id: images
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/images.tar
          key: test-images-${{ hashFiles('.ci/images.txt') }}
      - name: Load cached images
        if: steps.images.outputs.cache-hit == 'true'
        run: docker load --input .ci/images.tar
      - name: Pull and cache images
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          make ci-images SHARD="$SHARD" IMAGES=.ci/images.txt PULL=-pull
          xargs docker save --output .ci/images.tar < .ci/images.txt
      - name: Save the image cache
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/images.tar
          key: test-images-${{ hashFiles('.ci/images.txt') }}

      # No LocalStack here: it needs an auth token, and the hosted jobs
      # carry none, so the AWS packages' LocalStack tests skip as "needs
      # localstack" and the coverage job names their floors as unchecked
      # rather than failing them. A developer with a token runs them with
      # make ci.
      - name: make ci-containers
        env:
          PLEIADES_TEST_ARTIFACTS: ${{ runner.temp }}/test-logs
        run: make ci-containers SHARD="$SHARD"
      - name: Keep the coverage for the floor check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-containers-${{ matrix.shard }}
          path: .coverage/*.json
          if-no-files-found: error
          include-hidden-files: true
      # Every line each Controller and Runner of a failed tests/e2e test
      # printed, masked (tests/e2e/proclog_test.go keeps a test's files only
      # when it fails), since the job log quotes a failure's last forty
      # lines and a stuck job is explained by what was printed minutes
      # earlier. Kept even when the job passes: a failure tolerated as
      # contention is the one worth reading.
      - name: Keep the process logs of a failed test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs-containers-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-logs
          if-no-files-found: ignore
          retention-days: 14

  # branch-containers runs a branch's changed container packages on the
  # same runners and images as the containers shards, before its pull
  # request exists (make branch-containers dispatches it), because this
  # machine's Docker Desktop is a VM and a container test that leans on the
  # host has passed here and failed on a runner's native engine (FAILURE_PATTERNS
  # 426, 755). Only a dispatch with packages runs it, and such a dispatch runs
  # nothing else.
  branch-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.packages != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-go
      - name: make ci-branch-plan
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
        run: make -s ci-branch-plan >> "$GITHUB_OUTPUT"
  branch-containers:
    needs: branch-plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.branch-plan.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # PACKAGES reaches make through the environment only: a variable on
    # make's command line has its $(...) expanded before a recipe reads it.
    env:
      SHARD: ${{ matrix.shard }}/${{ needs.branch-plan.outputs.count }}
      PACKAGES: ${{ needs.branch-plan.outputs.packages }}
    steps:
      - name: Free disk space, in the background
        run: |
          ( sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
            touch "$RUNNER_TEMP/disk-freed" ) > /dev/null 2>&1 &
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - name: Docker Hub token present?
        id: hub
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        if: steps.hub.outputs.present == 'yes'
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$TOKEN" | docker login --username "$USERNAME" --password-stdin
      - name: List this shard's images
        run: make ci-images SHARD="$SHARD" IMAGES=.ci/images.txt
      - name: Wait for the disk to be freed
        run: |
          for _ in $(seq 600); do
            if [ -f "$RUNNER_TEMP/disk-freed" ]; then df -h / | tail -1; exit 0; fi
            sleep 1
          done
          echo "freeing the disk did not finish within ten minutes" >&2
          exit 1
      - name: Restore cached images
        id: images
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/images.tar
          key: test-images-${{ hashFiles('.ci/images.txt') }}
      - name: Load cached images
        if: steps.images.outputs.cache-hit == 'true'
        run: docker load --input .ci/images.tar
      - name: Pull images
        if: steps.images.outputs.cache-hit != 'true'
        run: make ci-images SHARD="$SHARD" IMAGES=.ci/images.txt PULL=-pull
      - name: make ci-containers
        env:
          PLEIADES_TEST_ARTIFACTS: ${{ runner.temp }}/test-logs
        run: make ci-containers SHARD="$SHARD"
      - name: Keep the process logs of a failed test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs-branch-containers-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-logs
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    # The ratchet, from the numbers the test jobs recorded. It checks
    # floors only when every test job passed: a failed job's numbers are not
    # a measurement, and a floored package with no number fails here. It
    # runs, and fails, when one did not, rather than being skipped: GitHub
    # counts a skipped required check as passed, so a failed shard the
    # ruleset does not name by number would otherwise not block a merge.
    # Requiring this one job therefore requires every shard, however many.
    if: always() && github.event_name != 'schedule' && inputs.packages == ''
    needs: [fast, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Every test job passed
        env:
          FAST: ${{ needs.fast.result }}
          CONTAINERS: ${{ needs.containers.result }}
        run: |
          if [ "$FAST" != success ] || [ "$CONTAINERS" != success ]; then
            echo "fast: $FAST, containers: $CONTAINERS; the floors are checked only from jobs that passed" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-go
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: .coverage
          merge-multiple: true
      - name: make coverage-measured
        run: make coverage-measured

  nightly:
    # The whole suite in one strict pass, with no tolerance, on the default
    # branch. What the pull-request jobs forgive as contention, this counts.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.packages == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      # Full history: the upgrade gates build the previous release from where
      # this branch left main, which a one-commit checkout does not hold.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - name: Pull every container package's images
        run: make ci-images SHARD=1/1 IMAGES=.ci/images.txt PULL=-pull
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # The same socat the fast job installs: without it the six PTY-backed
      # serial tests skip, and their packages fall below floors the fast
      # job's coverage set.
      - name: Install socat for the PTY-backed serial tests
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends socat
      - name: make test-full
        env:
          PLEIADES_TEST_REQUIRE: userns,socat,refusing-port
          PLEIADES_TEST_ARTIFACTS: ${{ runner.temp }}/test-logs
        run: make test-full
      - name: Keep the process logs of a failed test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs-nightly
          path: ${{ runner.temp }}/test-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: make coverage-measured
        run: make coverage-measured

  vulns:
    # An advisory is published against code that has not changed, and the
    # scheduled run skips the ci job, so one published after the last push
    # waited for the next pull request to be seen: twelve did in October
    # 2026, and main's own checks failed for it. Its own job, so a new
    # advisory fails within minutes and under its own name rather than at
    # the end of nightly's hour.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.packages == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-go
      - name: Install pinned tools
        run: make tools
      - name: make govulncheck
        run: make govulncheck
