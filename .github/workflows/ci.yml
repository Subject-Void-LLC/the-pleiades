name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # gopls is part of AGENTS.md's own required tooling for anyone
      # editing this repository, but is not something CI itself invokes;
      # gosec and govulncheck are the two CI actually runs (Makefile's
      # `ci` target), so only those two are installed here.
      #
      # The versions deliberately are not named here. `make tools`
      # installs the ones pinned in the Makefile (GOSEC_VERSION,
      # GOVULNCHECK_VERSION), which is also what a developer's own
      # `make ci` installs, so this job and a local run cannot check with
      # different scanners. These steps previously installed @latest,
      # which meant a new scanner release could turn this job red on a
      # commit that changed nothing, and that a local pass said nothing
      # reliable about what would happen here. Bumping a version is a
      # commit against the Makefile, reviewed like any other change.
      #
      # This step is redundant with `make ci` (which depends on `tools`)
      # and is kept only so that a tool installation failure shows up as
      # its own red step rather than inside the ci step's output.
      - name: Install pinned gosec and govulncheck
        run: make tools

      # `make helm-lint` (tools/helm-lint) shells out to a real helm binary to
      # render helm/the-pleiades and to prove the configurations that chart
      # refuses really are refused. ubuntu-latest does not ship one, and the
      # tool fails rather than skipping when helm is missing, so it has to be
      # installed here.
      #
      # Downloaded and checksummed rather than pulled in through a third-party
      # action, and pinned to an exact version rather than a channel, for the
      # same reason GOSEC_VERSION and GOVULNCHECK_VERSION are pinned in the
      # Makefile: a renderer that changes underneath this job could turn CI red
      # on a commit that changed nothing, and a local run would stop predicting
      # what happens here. The checksum is the one published beside the archive
      # at https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz.sha256sum, so a
      # tampered or truncated download fails this step instead of quietly
      # linting with something else.
      - name: Install pinned Helm
        env:
          HELM_VERSION: v4.2.4
          HELM_SHA256: c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3
        run: |
          set -euo pipefail
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf helm.tar.gz linux-amd64
          helm version --short

      # internal/lock, internal/event, and internal/transport/ssh's own
      # conformance/container tests dial real, ephemeral Docker containers
      # (NATS, sshd); ubuntu-latest ships Docker already, so this is not a
      # separate setup step, just a note that `make ci` genuinely needs it.
      #
      # internal/catalog/cloud/aws/ec2 and .../s3's own tests dial a real
      # LocalStack container the same way, and LocalStack's own licensing
      # requires an auth token to start even its free tier (a real,
      # verified relicensing, not a Pro-only gate); each test's own
      # requireLocalStack helper skips cleanly with no token rather than
      # failing, which is what keeps a fork's pull_request run (GitHub
      # never exposes a base repo's secrets to a fork's workflow run) from
      # going red for a reason that has nothing to do with its own change
      # -- it just measures those two packages without LocalStack coverage
      # instead, matching a plain local run with no
      # .IGNORE/.localstack.env. LOCALSTACK_AUTH_TOKEN itself is a
      # repository secret (Settings -> Secrets and variables -> Actions),
      # the same value .IGNORE/.localstack.env holds for a local run; a
      # push to this repository or a same-repository pull request sees it
      # and gets the real coverage these two packages' floors were
      # recorded against.
      - name: ci
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: make ci
