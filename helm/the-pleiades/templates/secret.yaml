{{- include "the-pleiades.validate" . -}}
{{- if not .Values.secrets.existingSecret }}
{{- /*
Every credential in this release, in one Secret.

WHAT IT HOLDS AND WHY IT IS ONE OBJECT. The master encryption key and the JWT
signing secret are the controller's, the database DSN is read by the controller
and the password inside it is read by the in-chart PostgreSQL. Splitting them
would mean two objects that have to agree on the same password, and a chart
whose database and controller disagreed would install cleanly and then fail to
connect.

WHERE THESE VALUES HAVE ALREADY BEEN. Anything passed with --set is stored by
Helm in the release secret, so `helm get values <release>` prints it back and
anyone with read access to that namespace's secrets can read it. That is true
of every chart that takes a password as a value and it is worth knowing rather
than assuming otherwise. The way out is secrets.existingSecret (or
externalDatabase.existingSecret), which points at a Secret you manage, made by
the External Secrets Operator, a Vault sidecar, or by hand, and then no
credential passes through Helm at all.

STRINGDATA, NOT DATA. stringData takes the plain value and Kubernetes base64
encodes it on the way in, so nothing here has to be pre-encoded and a
double-encoded key (base64 of a base64 string, which the controller rejects at
startup with a message about key length) cannot happen by accident.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "the-pleiades.secretName" . }}
  labels:
    {{- include "the-pleiades.labels" (dict "root" . "component" "controller") | nindent 4 }}
type: Opaque
stringData:
  MASTER_ENCRYPTION_KEY: {{ .Values.secrets.masterEncryptionKey | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- if not .Values.externalDatabase.existingSecret }}
  DB_DSN: {{ include "the-pleiades.databaseDSN" . | quote }}
  {{- end }}
  {{- /* The same password that appears inside the DSN above, as its own key,
         because the PostgreSQL container takes it as POSTGRES_PASSWORD and
         parsing it back out of a DSN in a template would be a second place
         for the two to disagree. */}}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}
{{- end }}
