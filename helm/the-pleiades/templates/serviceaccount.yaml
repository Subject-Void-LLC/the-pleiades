{{- include "the-pleiades.validate" . -}}
{{- if .Values.serviceAccount.create }}
{{- /*
One ServiceAccount for every pod in this release.

It holds no Role and no RoleBinding, because nothing in this chart talks to the
Kubernetes API: the controller reaches a database and a broker, and the runner
reaches the broker and then real devices. So there is no privilege here to
separate per workload, and one account is one thing to annotate rather than
four.

The token is not mounted by default (serviceAccount.automount), and that is
worth keeping. A projected API token in a pod that never calls the API is a
credential lying around inside a container that runs other people's automation.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "the-pleiades.serviceAccountName" . }}
  labels:
    {{- include "the-pleiades.labels" (dict "root" . "component" "controller") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
