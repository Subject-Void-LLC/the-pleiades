# Gates a release: no fixable high or critical vulnerability and no
# credential ships, and writes an SBOM describing what does.
# Blast radius: release-box only.
# Changes: writes the SBOM under /srv/release; the scans only read.
# Undo: pleiades rollback <run-id> removes the SBOM directory.
id: scan-release
hosts: release-box
tasks:
  - name: No fixable high or critical vulnerability ships
    scan.vuln:
      image_archive: /srv/release/app.tar
      fail_on: high
      fixable_only: true
      ignore: /srv/app/vuln-ignore.yaml

  - name: No credential ships
    scan.secrets:
      dir: /srv/app
      ignore: /srv/app/secrets-ignore.yaml

  - name: Describe what ships
    scan.sbom:
      image_archive: /srv/release/app.tar
      dest: /srv/release/sbom-2.4.1
      name: app
      version: 2.4.1
      supplier: "Organization: Example Co"
