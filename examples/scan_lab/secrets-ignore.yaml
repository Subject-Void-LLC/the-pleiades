# The ignore file scan.secrets reads from the device (copy it to
# /srv/app/secrets-ignore.yaml). Each id is a finding's fingerprint,
# file:rule:line with the file relative to the scanned directory. Every
# entry needs a reason and an end date (YYYY-MM-DD, in UTC, at most a year
# from the run); past its date an entry suppresses nothing and the run
# says so.
- id: docs/example.ini:generic-api-key:3
  reason: a documented placeholder, never a real key
  until: 2027-06-30
