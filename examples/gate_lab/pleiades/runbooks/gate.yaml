# Lists how the project's checks are classified, then runs the pure and
# database ones on the build box.
# Blast radius: build-box only.
# Changes: nothing; the checks read and report.
# Undo: nothing to undo.
id: gate-lab
hosts: build-box
tasks:
  - name: Show how the project's checks are classified
    gate.list:
      manifest: /srv/app/gates.yaml
    register: classified

  - name: Run the pure and db checks
    gate.run:
      manifest: /srv/app/gates.yaml
      kinds: [pure, db]
