# The Pleiades static inventory (Crawl tier).
#
# build-box is any Linux server you can reach over SSH that holds a checkout
# of your project and, for image checks, runs Docker or Podman. Point host and
# port at it, then:
#   pleiades add-credential build-box --username <you> --password-stdin
#   pleiades onboard build-box     # finds its container engine, if it runs one
# Credentials are never stored here or anywhere in this directory.
hosts:
  - id: build-box
    name: build-box
    type: linux_server
    tags:
      - gate
    properties:
      host: 127.0.0.1
      port: 2222
