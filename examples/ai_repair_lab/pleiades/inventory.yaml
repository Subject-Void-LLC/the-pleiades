# The Pleiades static inventory (Crawl tier).
#
# dockerhost is this machine's own Docker (or Podman); no host is named, so it
# is reached through the local socket. workstation is a local Ollama. Onboard
# both once, which makes no model call and starts nothing:
#   pleiades onboard dockerhost
#   pleiades onboard workstation
# Neither needs a stored credential. Point api_base at your Ollama if it is
# not on this machine, and pull the model first: ollama pull gemma4:e4b-it-qat
hosts:
    - id: dockerhost
      name: dockerhost
      type: container_host
    - id: workstation
      name: workstation
      type: ai_provider
      properties:
        ai_kind: ollama
        ai_price_currency: USD
        ai_prices: gemma4:e4b-it-qat=0/0
        api_base: http://127.0.0.1:11434
        residency: local
