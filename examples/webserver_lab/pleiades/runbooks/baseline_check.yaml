# A baseline read of a plain Linux host: its name and OS release, its root
# disk's use, and whether the service account can use sudo.
# Blast radius: the plain host, read only.
# Changes: nothing; every command reads.
# Undo: nothing to undo.
id: baseline_check
hosts: plain
tasks:
  - name: Confirm hostname and OS release
    ssh_exec:
      command: hostname && cat /etc/os-release | head -n 2

  - name: Check disk usage
    ssh_exec:
      command: df -h /

  - name: Confirm the service account can use sudo
    ssh_exec:
      command: sudo whoami
