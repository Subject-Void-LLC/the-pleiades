# Checks the nginx host: the service is up, it serves its default page,
# and which version it runs.
# Blast radius: the nginx-bootstrap host, read only.
# Changes: nothing; every command reads.
# Undo: nothing to undo.
id: nginx_check
hosts: nginx-bootstrap
tasks:
  - name: Confirm nginx is active
    ssh_exec:
      command: systemctl is-active nginx || service nginx status

  - name: Confirm nginx serves the default page
    ssh_exec:
      command: curl -s -o /dev/null -w "%{http_code}" http://localhost/

  - name: Report the nginx version
    ssh_exec:
      command: nginx -v
