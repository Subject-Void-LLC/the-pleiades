# Checks the WordPress host: Apache and MariaDB are up, the site answers,
# and wp-config.php is in place.
# Blast radius: the wordpress host, read only.
# Changes: nothing; every command reads.
# Undo: nothing to undo.
id: wordpress_check
hosts: wordpress
tasks:
  - name: Confirm Apache is active
    ssh_exec:
      command: systemctl is-active apache2 || service apache2 status

  - name: Confirm MariaDB is active
    ssh_exec:
      command: mysqladmin ping

  - name: Confirm the WordPress install responds
    ssh_exec:
      command: curl -s -o /dev/null -w "%{http_code}" http://localhost/

  - name: Confirm wp-config.php exists
    ssh_exec:
      command: test -f /var/www/html/wordpress/wp-config.php && echo present
