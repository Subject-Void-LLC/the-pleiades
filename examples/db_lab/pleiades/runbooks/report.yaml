# Counts the last day's orders and checks the reporting role can read and
# nothing more.
# Blast radius: the app database on db-host, read only.
# Changes: nothing; both tasks read.
# Undo: nothing to undo.
id: db-report
hosts: db-host
tasks:
  - name: Orders in the last day
    db.pg.query:
      connection: reporting
      database: app
      sql: SELECT count(*) AS orders FROM orders WHERE created_at > now() - interval '1 day'
    register: today

  - name: The reporting role can read and nothing more
    db.pg.grants:
      connection: appdb
      database: app
      role: reporting
      expect:
        database: [CONNECT]
        schemas: {public: [USAGE]}
        tables: {"public.*": [SELECT]}
