# Proves a backup restores: dumps the app database, restores the dump into
# a scratch database, and compares their row counts.
# Blast radius: db-host; the app database is only read.
# Changes: writes /var/backups/app.dump and creates app_restore_check.
# Undo: drop app_restore_check; pleiades rollback <run-id> removes the dump.
id: db-backup-verify
hosts: db-host
tasks:
  - name: Dump the application's database
    db.pg.dump:
      connection: appdb
      database: app
      dest: /var/backups/app.dump

  - name: Restore the dump into a scratch database
    db.pg.restore:
      connection: appdb
      database: app_restore_check
      src: /var/backups/app.dump
      create: true

  - name: The copy holds what the source held
    db.pg.rowcounts:
      connection: appdb
      database: app_restore_check
      compare:
        database: app
