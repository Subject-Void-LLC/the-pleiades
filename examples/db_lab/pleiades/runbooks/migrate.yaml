# Applies the application's database migrations, refusing any that is not
# additive.
# Blast radius: the app database on db-host.
# Changes: the schema, through the migrations in /srv/app/migrations.
# Undo: none is derived from SQL; write the reverse as a new migration.
id: db-migrate
hosts: db-host
tasks:
  - name: Apply the application's migrations, additive only
    db.pg.migrate:
      connection: appdb
      database: app
      dir: /srv/app/migrations
      role: app_owner
      additive_only: true
