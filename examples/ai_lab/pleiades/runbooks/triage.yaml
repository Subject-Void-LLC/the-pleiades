# Triages a ticket on a local model, held for a person when the model is
# unsure, and summarizes it, falling back to the lab server's model.
# Blast radius: the workstation and lab-ollama providers; nothing leaves
# the lab (residency: local).
# Changes: loads a model into the workstation's memory; appends usage to
# spend.jsonl.
# Undo: pleiades rollback <run-id> puts back the model loaded before.
id: ai-triage
name: Triage a ticket on a local model, held for a person when unsure, and summarize with a fallback.
hosts: workstation
tasks:
  - name: What the workstation has
    ai.model.list: {}

  - name: One model in memory
    ai.model.load:
      model: "qwen3:14b"

  - name: Triage the ticket
    ai.chat:
      model: "qwen3:14b"
      residency: local
      prompt_file: triage
      input: "Disk full on /var on db-2; writes have failed since 02:00."
      schema:
        type: object
        properties:
          label: {type: string, enum: [bug, outage, request]}
          confidence: {type: number, minimum: 0, maximum: 1}
        required: [label, confidence]
      max_tokens: 200
      usage_sink: spend.jsonl
      # Held for a person when the model is unsure, or answers with a
      # command that destroys data.
      review:
        - field: confidence
          below: 0.8
        - answer_matches: "(?i)\\b(drop|delete|rm -rf)\\b"
    register: triage

  - name: Summarize, falling back to the lab server
    ai.route:
      use: summarize
      routes:
        summarize:
          residency: local
          providers:
            - {provider: workstation, model: "qwen3:14b"}
            - {provider: lab-ollama, model: "qwen3:14b"}
      messages:
        - {role: user, content: "Summarize in one line: disk full on /var on db-2; writes failing since 02:00."}
      max_tokens: 60
      usage_sink: spend.jsonl
