# The tools tools/wincheck needs on win-check: Go, held to go.dev's digest;
# git (MinGit, Git for Windows' portable build); and gcc (WinLibs' MinGW-w64
# GCC), which turns cgo and the race detector on so the tests that open a
# SQLite database run there. MinGit and GCC are held to the digests their
# releases publish. win.archive.extract unpacks each once, its creates
# naming the program that shows it is there.
id: vbox-lab-check-windows-tools
hosts: win-check
tasks:
  - name: fetch Go 1.26.9 for Windows
    win.file.download:
      url: https://go.dev/dl/go1.26.9.windows-amd64.zip
      path: C:\Windows\Temp\go1.26.9.windows-amd64.zip
      sha256: d722201a9c0c086d1610e111c48203009af690892ed708072bd5ae20160e7a59
  - name: fetch MinGit 2.56.0.2
    win.file.download:
      url: https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/MinGit-2.56.0.2-64-bit.zip
      path: C:\Windows\Temp\MinGit-2.56.0.2-64-bit.zip
      sha256: da35e72aa21c005a5a0d298cfbae110bc1609a815730ea0dde84b01a1b3cd3be
  - name: fetch WinLibs GCC 16.2.0 r2
    win.file.download:
      url: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r2.zip
      path: C:\Windows\Temp\winlibs-gcc-16.2.0-r2.zip
      sha256: d5dbafc4a170e762ca6143151ec918fb9e2c72736fb14cd704abebc6bdd5276a
      timeout: 1800
  - name: unpack Go into C:\go, once
    win.archive.extract:
      src: C:\Windows\Temp\go1.26.9.windows-amd64.zip
      dest: C:\
      creates: C:\go\bin\go.exe
  - name: unpack MinGit into C:\mingit, once
    win.archive.extract:
      src: C:\Windows\Temp\MinGit-2.56.0.2-64-bit.zip
      dest: C:\mingit
      creates: C:\mingit\cmd\git.exe
  - name: unpack GCC into C:\mingw64, once
    win.archive.extract:
      src: C:\Windows\Temp\winlibs-gcc-16.2.0-r2.zip
      dest: C:\
      creates: C:\mingw64\bin\gcc.exe
      timeout: 1800
