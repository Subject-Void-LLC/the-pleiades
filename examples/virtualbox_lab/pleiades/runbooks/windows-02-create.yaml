# Make the Windows lab VM from the base and boot it.
# Blast radius: vengeance, the VirtualBox host; win-lab, a lab VM nothing
#   else depends on.
# Changes: through virt.vbox.vm.clone and virt.vbox.vm.start.
# Undo: pleiades rollback of this run stops and deletes win-lab.
#
# login names the inventory device whose stored credential the VM gets. It
# must be a Windows device (reached over WinRM) whose credential names
# Administrator: run `pleiades add-credential win-lab --username
# Administrator --generate` first. Its password goes into the VM's answer
# file. The clone task boots the VM once to prove its Administrator logs
# in with that password at its address under its own name, then shuts it
# down and deletes the answer file; a clone not proven is deleted and the
# task fails. The start task then boots it for use.
#
# With no size, a Windows clone is small (one CPU). Keep it that way on a
# host where WSL 2 or Docker Desktop runs if the base boots with EFI: see
# the README's limits.
id: vbox-lab-windows-create
hosts: vengeance
tasks:
  - name: make the Windows lab VM from the base's snapshot
    virt.vbox.vm.clone:
      name: win-lab
      from: ws2025-core-base
      snapshot: base
      login: win-lab
      address: 192.168.56.30/24
  - name: start it
    virt.vbox.vm.start:
      name: win-lab
