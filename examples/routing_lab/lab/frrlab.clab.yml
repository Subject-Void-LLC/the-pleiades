# The routing lab: three FRR routers in an OSPF triangle, an Open vSwitch switch
# behind r1 with h1 on 10.1.1.0/24, and h2 on r3's LAN 10.3.3.0/24.
# Each node's SSH port is published on 127.0.0.1, since container addresses are
# not reachable from WSL with Docker Desktop.
name: frrlab
mgmt:
  network: frrlab-mgmt
  ipv4-subnet: 172.31.250.0/24
topology:
  defaults:
    kind: linux
  nodes:
    r1:
      image: frrlab/frr-ssh:10.1.1
      ports: ["127.0.0.1:2201:22"]
      binds:
        - configs/r1.frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
        - ../keys/netops.pub:/home/netops/.ssh/authorized_keys:ro
    r2:
      image: frrlab/frr-ssh:10.1.1
      ports: ["127.0.0.1:2202:22"]
      binds:
        - configs/r2.frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
        - ../keys/netops.pub:/home/netops/.ssh/authorized_keys:ro
    r3:
      image: frrlab/frr-ssh:10.1.1
      ports: ["127.0.0.1:2203:22"]
      binds:
        - configs/r3.frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
        - ../keys/netops.pub:/home/netops/.ssh/authorized_keys:ro
    sw1:
      image: frrlab/ovs-ssh:alpine3.20.10
      ports: ["127.0.0.1:2211:22"]
      binds:
        - ../keys/netops.pub:/home/netops/.ssh/authorized_keys:ro
    h1:
      image: alpine:3.20.10
      cmd: sleep infinity
      exec:
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.1.1.1
    h2:
      image: alpine:3.20.10
      cmd: sleep infinity
      exec:
        - ip addr add 10.3.3.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.3.3.1
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "r3:eth2"]
    - endpoints: ["r1:eth3", "sw1:eth1"]
    - endpoints: ["sw1:eth2", "h1:eth1"]
    - endpoints: ["r3:eth3", "h2:eth1"]
