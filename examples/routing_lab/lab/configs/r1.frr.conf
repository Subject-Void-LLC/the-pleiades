frr version 10.1.1
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface eth1
 description to-r2
 ip address 10.0.12.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description to-r3
 ip address 10.0.13.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth3
 description lan-10.1.1.0
 ip address 10.1.1.1/24
 ip ospf area 0
 ip ospf passive
exit
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
exit
!
router ospf
 ospf router-id 10.255.0.1
exit
!
