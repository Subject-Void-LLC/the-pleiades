frr version 10.1.1_git
frr defaults traditional
hostname r3
domainname localdomain
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth1
 description to-r1
 ip address 10.0.13.2/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description to-r2
 ip address 10.0.23.2/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth3
 description lan-10.3.3.0
 ip address 10.3.3.1/24
 ip ospf area 0
 ip ospf passive
exit
!
interface lo
 ip address 10.255.0.3/32
 ip ospf area 0
exit
!
router ospf
 ospf router-id 10.255.0.3
exit
!
end
