# Same upgrade as upgrade_ios_xe.yaml, written with module-as-key sugar
# instead of explicit fqcn:/params: pairs: a task's own module name
# becomes the mapping key, and its arguments are that key's value
# directly. Both syntaxes are accepted, task by task, forever; this file
# exists purely to show the sugar shape side by side with the explicit
# one. See ../../README.md.
#
# Run with: pleiades run runbooks/upgrade_ios_xe_sugar.yaml
id: upgrade-ios-xe-sugar
metadata:
  service_effecting: true

pretasks:
  - name: Get Config
    net.cli.command:
      target: sw1
      command: "show running-config"
    register: running_config
    # hide the running config from the run report, since it may contain secrets
    register_mask: running_config.stdout

  - name: Record the currently running version
    net.cli.command:
      target: sw1
      command: "show version | include Version"
    register: pre_facts

  - name: Check free space on flash before pulling a new image
    net.cli.command:
      target: sw1
      command: "dir flash:"
    register: flash_dir

tasks:
  - name: Upgrade sw1
    block:
      - name: Back up the running config before touching anything
        net.ios.config:
          target: sw1
          backup: true

      - name: Pull the new image onto flash
        net.cli.command:
          target: sw1
          command: "copy http://10.10.10.5/images/cat9k_iosxe.17.03.04.SPA.bin flash:cat9k_iosxe.17.03.04.SPA.bin"
          prompt:
            - "Destination filename"
          answer:
            - "\r"
          check_all: true

      - name: Verify the image checksum before trusting it
        net.cli.command:
          target: sw1
          command: "verify /md5 flash:cat9k_iosxe.17.03.04.SPA.bin 5f4dcc3b5aa765d61d8327deb882cf99"
        register: md5_check

      - name: Point the boot variable at the new image and save
        net.ios.config:
          target: sw1
          lines:
            - "boot system flash:cat9k_iosxe.17.03.04.SPA.bin"
          save_when: modified
        when_cel: 'stat.md5_check["sw1"].stdout.matches("Verified")'

      - name: Reload the switch
        net.cli.command:
          target: sw1
          command: reload
          prompt:
            - "confirm"
          answer:
            - "\r"
          sendonly: true
        when_cel: 'stat.md5_check["sw1"].stdout.matches("Verified")'

    rescue:
      - name: Record the failure for the run report
        pleiades.builtin.set_metadata:
          data:
            upgrade_failed: true
            note: "sw1 failed before reload; running config is unchanged, boot variable was not committed"

      # Would ideally quote the pre-upgrade version captured by "Record the
      # currently running version" (register: pre_facts) so the operator
      # knows exactly what to roll back to. That is not possible yet:
      # params is a literal map with no templating (same gap the README's
      # "No Jinja templating in params" section documents for hosts:), so
      # a static, host-specific message is the honest ceiling today.
      - name: Display rollback instructions for the operator
        pleiades.builtin.set_metadata:
          data:
            rollback_instructions: >-
              Automatic rollback is not implemented yet (docs/rollback_journal_design.md).
              To recover sw1 by hand: reconnect to 10.10.20.11 over console or SSH, run
              "show boot" to confirm the boot variable. If it already points at
              cat9k_iosxe.17.03.04.SPA.bin, run "no boot system
              flash:cat9k_iosxe.17.03.04.SPA.bin" then "write memory" and reload. The
              pre-upgrade running version this attempt started from is in this run's own
              "pre_facts" data (see the pretasks above) but cannot be quoted here directly;
              check that task's own output. The pre-upgrade config backup task in this same
              block may not have run either; restore config from your own change-management
              backup if it drifted.

posttasks:
  - name: Wait for the switch to come back on SSH
    pleiades.builtin.wait.port:
      host: 10.10.20.11
      port: 22
      delay: 60
      timeout: 600

  - name: Re-check the running version
    net.cli.command:
      target: sw1
      command: "show version | include Version"
    register: post_facts

  - name: Record that the upgrade landed
    pleiades.builtin.set_metadata:
      data:
        upgrade_succeeded: true
        version: "17.03.04"
    when_cel: 'stat.post_facts["sw1"].stdout.matches("17\\.03\\.04")'

  - name: Record that the upgrade did not land
    pleiades.builtin.set_metadata:
      data:
        upgrade_succeeded: false
        note: "still not running 17.03.04 after reload"
    when_cel: '!stat.post_facts["sw1"].stdout.matches("17\\.03\\.04")'
